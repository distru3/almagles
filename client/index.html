<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1513" />
    <meta name="description" content="رجال الأمة — جدول المقرر الأسبوعي والمنشورات اليومية" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%230e1513'/%3E%3Cg fill='none' stroke='%23d8b25a' stroke-width='2.4'%3E%3Crect x='14' y='14' width='20' height='20'/%3E%3Crect x='14' y='14' width='20' height='20' transform='rotate(45 24 24)'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>رجال الأمة</title>
    <script>
      // Night («السَّحَر») is the default; light only when the visitor chose it.
      (function () {
        var t = null;
        try { t = localStorage.getItem('almagles_theme'); } catch (e) {}
        if (t !== 'light') {
          document.documentElement.classList.add('dark');
        } else {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5efe3');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
