    <title>رجال الأمة</title>
    <script>
      (function() {
        var t = localStorage.getItem('almagles_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
